name: Build LinkResolver Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - linkresolver-apk-build
    paths:
      - ".github/workflows/linkresolver-apk.yml"

permissions:
  contents: read

concurrency:
  group: linkresolver-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test LinkResolver
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out LinkResolver source
        run: git clone --depth 1 https://github.com/Harbertraj/LinkResolver.git linkresolver-source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: linkresolver-source

      - name: Build debug APK
        working-directory: linkresolver-source
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Run unit tests
        working-directory: linkresolver-source
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkResolver-debug-APK
          path: linkresolver-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LinkResolver-test-reports
          path: linkresolver-source/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
