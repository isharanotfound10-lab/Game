name: Telegram Bot Checks
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r telegram-video-bot/requirements.txt
      - run: python -m compileall -q telegram-video-bot
      - run: python -m unittest discover -s telegram-video-bot/tests -v
